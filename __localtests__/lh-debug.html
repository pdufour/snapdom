<!DOCTYPE html>
<html>
<body>
  <div id="test" style="font-size: 24px; background: #fff; width: 400px; padding: 30px; display: inline-block; font-family: -apple-system, system-ui, sans-serif;">
    <label id="target-label" style="display: block; font-size: 48px; font-weight: 700; color: #444; margin: 0 0 25px 0; letter-spacing: normal;">
      <span id="target">Email Address</span>
      <input type="email" placeholder="you@example.com" style="padding: 12px 16px; border: 2px solid #ddd; width: 100%; font-size: 50px; display: block;">
    </label>
  </div>
  <hr>
  <button onclick="run()">Run Capture</button>
  <div id="output"></div>

  <script type="module">
    import { snapdom } from '../dist/snapdom.mjs';
    window.run = async () => {
      const target = document.getElementById('test');
      const svgUrl = await snapdom.toRaw(target, { embedFonts: true });
      const img = new Image();
      img.src = svgUrl;
      document.getElementById('output').innerHTML = '';
      document.getElementById('output').appendChild(img);
      console.log('SVG URL:', svgUrl);
    };
  </script>
</body>
</html>
