<!doctype html>
<!--
README (local harness): Massive SVG text/baseline stress test

Usage:
  - Open directly in browser, or serve repo root and visit:
      /__localtests__/svg-massive-text-metrics.html?count=1000&seed=1337
  - Optional JSON dump script:
      node __localtests__/run-svg-massive-text-metrics.mjs --count=1000 --output=__localtests__/svg-massive-text-metrics.summary.json

Query params:
  - count (number, default 1000): number of generated text cases
  - seed (number, default 1337): deterministic RNG seed for reproducible case mix
  - width (number, default 2400): SVG width in CSS pixels
  - rowHeight (number, default 28): vertical spacing per case row
  - visibleRows (number, default 120): number of rows shown in results table
  - sortBy (string, default driftBaselineVsCanvas): metrics key used for table sort
  - sortDir (asc|desc, default desc): sort direction
  - outlierSigma (number, default 2.5): z-score threshold for outlier highlighting

Metric notes:
  - bbox.*: SVG geometry from getBBox()
  - lengthSvg: getComputedTextLength() from SVG text layout
  - canvas.*: Canvas TextMetrics values from measureText()
  - range.*: DOM Range bounding box over SVG text contents
  - drift* fields: layout differences among APIs; near zero is tighter agreement
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Massive Text Metrics</title>
    <style>
      :root {
        --bg: #0f1220;
        --panel: #171b2d;
        --panel-soft: #1d2238;
        --text: #e9ecff;
        --muted: #9ea9d6;
        --good: #49d38b;
        --warn: #f5c163;
        --bad: #ff6f78;
        --line: #2a3255;
        --focus: #7fa1ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .app {
        display: grid;
        grid-template-columns: 430px 1fr;
        min-height: 100vh;
      }
      .panel {
        border-right: 1px solid var(--line);
        background: linear-gradient(180deg, var(--panel), #12162a);
        overflow: auto;
        padding: 14px;
      }
      .render {
        overflow: auto;
        position: relative;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .hint {
        color: var(--muted);
        margin: 0 0 10px;
        font-size: 12px;
        line-height: 1.4;
      }
      .kv {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 5px 10px;
        font-size: 12px;
        margin-bottom: 14px;
      }
      .kv .key {
        color: var(--muted);
      }
      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 7px;
        font-size: 11px;
      }
      .ok {
        color: var(--good);
      }
      .warn {
        color: var(--warn);
      }
      .bad {
        color: var(--bad);
      }
      .section {
        margin: 0 0 14px;
      }
      .section h2 {
        margin: 0 0 6px;
        font-size: 13px;
        color: #bfd0ff;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        font-size: 11px;
        border-bottom: 1px solid var(--line);
        padding: 4px;
        vertical-align: top;
      }
      th {
        color: #bcd1ff;
        text-align: left;
        cursor: pointer;
        user-select: none;
        position: sticky;
        top: 0;
        background: var(--panel-soft);
      }
      tr:hover td {
        background: #242b47;
      }
      tr.outlier td {
        background: color-mix(in oklab, var(--bad) 10%, transparent);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace;
      }
      .stats {
        max-height: 240px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      #stage {
        background: #ffffff;
        display: block;
      }
      .footer {
        margin-top: 10px;
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <h1>Massive SVG Text Metrics</h1>
        <p id="status" class="hint">Running measurements...</p>
        <div class="kv" id="meta"></div>

        <section class="section">
          <h2>Summary</h2>
          <div class="stats">
            <table>
              <thead>
                <tr>
                  <th>metric</th>
                  <th>min</th>
                  <th>max</th>
                  <th>mean</th>
                  <th>stddev</th>
                </tr>
              </thead>
              <tbody id="summary-body"></tbody>
            </table>
          </div>
        </section>

        <section class="section">
          <h2>Drift Buckets (abs px)</h2>
          <div class="stats">
            <table>
              <thead>
                <tr>
                  <th>drift</th>
                  <th>&lt;=0.25</th>
                  <th>&lt;=0.5</th>
                  <th>&lt;=1</th>
                  <th>&lt;=2</th>
                  <th>&lt;=4</th>
                  <th>&lt;=8</th>
                  <th>&gt;8</th>
                </tr>
              </thead>
              <tbody id="bucket-body"></tbody>
            </table>
          </div>
        </section>

        <section class="section">
          <h2>Per-case Rows</h2>
          <div class="stats">
            <table>
              <thead>
                <tr>
                  <th data-key="idx">#</th>
                  <th data-key="fontSize">size</th>
                  <th data-key="fontWeight">weight</th>
                  <th data-key="dominantBaseline">baseline</th>
                  <th data-key="driftBaselineVsCanvas">drift baseline</th>
                  <th data-key="driftWidthSvgVsCanvas">drift width</th>
                  <th data-key="driftHeightRangeVsBBox">drift range-h</th>
                </tr>
              </thead>
              <tbody id="rows-body"></tbody>
            </table>
          </div>
        </section>

        <p class="footer mono" id="timing"></p>
      </aside>

      <main class="render">
        <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
      </main>
    </div>

    <script>
      ;(() => {
        // Histogram edges for absolute drift buckets (CSS px).
        // Rationale: edges match common UI perceptual thresholds (quarter/half/full pixels)
        // and double thereafter for quick triage of severe drift.
        const DRIFT_BUCKET_EDGES_ABS_PX = [0.25, 0.5, 1, 2, 4, 8]
        const SVG_NS = 'http://www.w3.org/2000/svg'
        const url = new URL(location.href)
        const query = url.searchParams

        // Small offscreen canvas for `measureText` only.
        // Rationale: text metrics do not depend on canvas size; keep it tiny to reduce memory.
        const MEASURE_CTX_CANVAS_SIDE_PX = 16

        const config = {
          count: clamp(toInt(query.get('count'), 1000), 1, 20000),
          seed: toInt(query.get('seed'), 1337),
          width: clamp(toInt(query.get('width'), 2400), 800, 5000),
          rowHeight: clamp(toInt(query.get('rowHeight'), 28), 16, 80),
          visibleRows: clamp(toInt(query.get('visibleRows'), 120), 10, 2000),
          sortBy: query.get('sortBy') || 'driftBaselineVsCanvas',
          sortDir: query.get('sortDir') === 'asc' ? 'asc' : 'desc',
          outlierSigma: clamp(toNum(query.get('outlierSigma'), 2.5), 0.5, 8),
          // DOMRect reads are relatively expensive; allow disabling when focusing on drift math.
          // Use 1/0 to keep query string concise.
          collectDomRects: query.get('collectDomRects') !== '0',
        }

        const ctx = makeCanvasContext()
        const stage = document.getElementById('stage')
        const summaryBody = document.getElementById('summary-body')
        const bucketBody = document.getElementById('bucket-body')
        const rowsBody = document.getElementById('rows-body')
        const statusEl = document.getElementById('status')
        const metaEl = document.getElementById('meta')
        const timingEl = document.getElementById('timing')

        const rng = mulberry32(config.seed)
        const cases = generateCases(config.count, rng)
        const tRender0 = performance.now()
        renderStage(stage, cases, config)
        const tRender1 = performance.now()

        requestAnimationFrame(() => {
          const t0 = performance.now()
          const measured = measureCases(cases, ctx, stage, config)
          const tMeasure = performance.now()
          const stats = computeStats(measured)
          const tStats = performance.now()
          const buckets = computeDriftBuckets(measured)
          const tBuckets = performance.now()
          const outlierSet = detectOutliers(measured, stats, config.outlierSigma)
          const tOutliers = performance.now()
          const sorted = sortRows(measured, config.sortBy, config.sortDir)
          const renderRows = sorted.slice(0, config.visibleRows)
          const tSort = performance.now()
          const tReport0 = performance.now()

          renderMeta(metaEl, config, measured, outlierSet.size)
          renderSummary(summaryBody, stats)
          renderBuckets(bucketBody, buckets)
          renderCases(rowsBody, renderRows, outlierSet)
          wireSortHeaders(measured, outlierSet, config)
          const tReport1 = performance.now()

          statusEl.innerHTML = [
            '<span class="pill ok">done</span> ',
            `${measured.length} cases measured in one SVG.`,
          ].join('')
          timingEl.textContent =
            `render ${(tRender1 - tRender0).toFixed(1)}ms | ` +
            `measure ${(tMeasure - t0).toFixed(1)}ms | ` +
            `stats ${(tStats - tMeasure).toFixed(1)}ms | ` +
            `buckets ${(tBuckets - tStats).toFixed(1)}ms | ` +
            `outliers ${(tOutliers - tBuckets).toFixed(1)}ms | ` +
            `sort ${(tSort - tOutliers).toFixed(1)}ms | ` +
            `report ${(tReport1 - tReport0).toFixed(1)}ms | ` +
            `total ${(tReport1 - t0).toFixed(1)}ms`

          const payload = {
            config,
            measuredCount: measured.length,
            stats,
            buckets,
            outlierCount: outlierSet.size,
            topRows: sorted.slice(0, 50),
            timestamp: new Date().toISOString(),
          }
          window.__SVG_METRICS_RESULT__ = payload
          window.__SVG_METRICS_DONE__ = true
        })

        function toInt(value, fallback) {
          const n = Number.parseInt(value || '', 10)
          return Number.isFinite(n) ? n : fallback
        }

        function toNum(value, fallback) {
          const n = Number(value)
          return Number.isFinite(n) ? n : fallback
        }

        function clamp(v, min, max) {
          return Math.max(min, Math.min(max, v))
        }

        function mulberry32(seed) {
          let t = seed >>> 0
          return () => {
            t += 0x6d2b79f5
            let x = Math.imul(t ^ (t >>> 15), 1 | t)
            x ^= x + Math.imul(x ^ (x >>> 7), 61 | x)
            return ((x ^ (x >>> 14)) >>> 0) / 4294967296
          }
        }

        function pick(arr, random) {
          return arr[Math.floor(random() * arr.length)]
        }

        function makeCanvasContext() {
          const canvas = document.createElement('canvas')
          canvas.width = MEASURE_CTX_CANVAS_SIDE_PX
          canvas.height = MEASURE_CTX_CANVAS_SIDE_PX
          return canvas.getContext('2d')
        }

        function generateCases(count, random) {
          const fontFamilies = [
            'Arial, sans-serif',
            'Helvetica, Arial, sans-serif',
            '"Times New Roman", serif',
            'Georgia, serif',
            '"Courier New", monospace',
            '"Trebuchet MS", sans-serif',
            '"Gill Sans", sans-serif',
          ]
          const anchors = ['start', 'middle', 'end']
          const dominantBaselines = [
            'alphabetic',
            'text-before-edge',
            'middle',
            'central',
            'hanging',
            'ideographic',
          ]
          const alignmentBaselines = ['baseline', 'middle', 'hanging', 'alphabetic']
          const fontStyles = ['normal', 'italic']
          const weights = [300, 400, 500, 600, 700, 800]
          const letterSpacings = [-0.5, 0, 0.25, 0.5, 1]
          const lineHeights = [0.95, 1, 1.1, 1.2, 1.35, 1.5, 1.8]
          const sampleTokens = [
            'Hamburgefons',
            'AVWA ToTy',
            'gjpqy fl',
            'CAP-height',
            'Email_Label_42',
            'A|xj',
            'Baseline Test',
            'ffi Tj',
          ]

          const output = []
          for (let i = 0; i < count; i += 1) {
            const fontSize = 10 + Math.floor(random() * 34)
            const lineHeight = pick(lineHeights, random)
            const token = pick(sampleTokens, random)
            const text =
              i % 5 === 0
                ? `${token} #${i} | ${String.fromCharCode(65 + (i % 26))}${i % 10} gqy`
                : `${token} #${i}`
            output.push({
              idx: i,
              text,
              fontFamily: pick(fontFamilies, random),
              fontStyle: pick(fontStyles, random),
              fontWeight: pick(weights, random),
              fontSize,
              lineHeight,
              letterSpacing: pick(letterSpacings, random),
              textAnchor: pick(anchors, random),
              dominantBaseline: pick(dominantBaselines, random),
              alignmentBaseline: pick(alignmentBaselines, random),
            })
          }
          return output
        }

        function renderStage(svg, cases, cfg) {
          const height = Math.max(300, cfg.rowHeight * (cases.length + 2))
          svg.setAttribute('width', String(cfg.width))
          svg.setAttribute('height', String(height))
          svg.setAttribute('viewBox', `0 0 ${cfg.width} ${height}`)
          svg.textContent = ''

          const defs = document.createElementNS(SVG_NS, 'defs')
          const style = document.createElementNS(SVG_NS, 'style')
          style.textContent = `
            .axis-line { stroke: #e5e7eb; stroke-width: 0.6; opacity: 0.55; shape-rendering: crispEdges; }
            .case-text { fill: #111827; }
            .case-box { fill: none; stroke: #16a34a; stroke-width: 0.6; opacity: 0.35; }
          `
          defs.appendChild(style)
          svg.appendChild(defs)

          const xStart = 120
          const xSpan = cfg.width - xStart - 100

          for (let i = 0; i < cases.length; i += 1) {
            const c = cases[i]
            const y = cfg.rowHeight * (i + 1)
            const x = xStart + (xSpan * ((i % 17) / 16))

            const axis = document.createElementNS(SVG_NS, 'line')
            axis.setAttribute('class', 'axis-line')
            axis.setAttribute('x1', '0')
            axis.setAttribute('x2', String(cfg.width))
            axis.setAttribute('y1', String(y))
            axis.setAttribute('y2', String(y))
            svg.appendChild(axis)

            const text = document.createElementNS(SVG_NS, 'text')
            text.setAttribute('class', 'case-text')
            text.setAttribute('data-case-id', String(c.idx))
            text.setAttribute('x', String(x))
            text.setAttribute('y', String(y))
            text.setAttribute('font-family', c.fontFamily)
            text.setAttribute('font-style', c.fontStyle)
            text.setAttribute('font-weight', String(c.fontWeight))
            text.setAttribute('font-size', String(c.fontSize))
            text.setAttribute('letter-spacing', String(c.letterSpacing))
            text.setAttribute('text-anchor', c.textAnchor)
            text.setAttribute('dominant-baseline', c.dominantBaseline)
            text.setAttribute('alignment-baseline', c.alignmentBaseline)

            if (c.idx % 11 === 0) {
              const tspan1 = document.createElementNS(SVG_NS, 'tspan')
              tspan1.textContent = c.text
              tspan1.setAttribute('x', String(x))
              const tspan2 = document.createElementNS(SVG_NS, 'tspan')
              tspan2.textContent = ` line2/${c.idx % 9}`
              tspan2.setAttribute('x', String(x))
              tspan2.setAttribute('dy', String(c.fontSize * c.lineHeight))
              text.appendChild(tspan1)
              text.appendChild(tspan2)
            } else {
              text.textContent = c.text
            }

            svg.appendChild(text)
          }
        }

        function measureCases(cases, canvasCtx, svg, cfg) {
          // Avoid repeated querySelector() inside the hot loop.
          // Render order matches case order, so we can index into the NodeList.
          const els = svg.querySelectorAll('text[data-case-id]')
          const out = []
          for (let i = 0; i < cases.length; i += 1) {
            const c = cases[i]
            const el = els[i]
            if (!el) continue

            const x = Number(el.getAttribute('x')) || 0
            const y = Number(el.getAttribute('y')) || 0
            const bbox = safeBBox(el)
            const rect = cfg.collectDomRects ? el.getBoundingClientRect() : { width: 0, height: 0 }
            const rangeRect = safeRangeRect(el)
            const lengthSvg = safeNum(() => el.getComputedTextLength())
            const textForCanvas = el.textContent || c.text
            const canvas = measureCanvas(canvasCtx, c, textForCanvas)
            const anchorOffset = anchorOffsetFromBBox(c.textAnchor, bbox.width)
            const baselineYCanvas = y - canvas.actualBoundingBoxAscent
            const baselineYBBox = bbox.y

            out.push({
              ...c,
              x,
              y,
              bboxX: bbox.x,
              bboxY: bbox.y,
              bboxW: bbox.width,
              bboxH: bbox.height,
              lengthSvg,
              rectW: rect.width,
              rectH: rect.height,
              rangeW: rangeRect.width,
              rangeH: rangeRect.height,
              canvasW: canvas.width,
              canvasAscent: canvas.actualBoundingBoxAscent,
              canvasDescent: canvas.actualBoundingBoxDescent,
              canvasLeft: canvas.actualBoundingBoxLeft,
              canvasRight: canvas.actualBoundingBoxRight,
              anchorOffset,
              driftWidthSvgVsCanvas: bbox.width - canvas.width,
              driftWidthSvgLengthVsCanvas: lengthSvg - canvas.width,
              driftHeightRangeVsBBox: rangeRect.height - bbox.height,
              driftBaselineVsCanvas: baselineYBBox - baselineYCanvas,
              driftAnchorVsCanvas:
                (bbox.x - x + anchorOffset) - (-canvas.actualBoundingBoxLeft + anchorOffset),
            })
          }
          return out
        }

        function safeBBox(el) {
          try {
            const b = el.getBBox()
            return {
              x: Number.isFinite(b.x) ? b.x : 0,
              y: Number.isFinite(b.y) ? b.y : 0,
              width: Number.isFinite(b.width) ? b.width : 0,
              height: Number.isFinite(b.height) ? b.height : 0,
            }
          } catch {
            return { x: 0, y: 0, width: 0, height: 0 }
          }
        }

        function safeRangeRect(el) {
          try {
            const range = document.createRange()
            range.selectNodeContents(el)
            const rect = range.getBoundingClientRect()
            return {
              width: Number.isFinite(rect.width) ? rect.width : 0,
              height: Number.isFinite(rect.height) ? rect.height : 0,
            }
          } catch {
            return { width: 0, height: 0 }
          }
        }

        function safeNum(fn) {
          try {
            const value = fn()
            return Number.isFinite(value) ? value : 0
          } catch {
            return 0
          }
        }

        function measureCanvas(ctx, c, text) {
          if (!ctx) {
            return {
              width: 0,
              actualBoundingBoxAscent: 0,
              actualBoundingBoxDescent: 0,
              actualBoundingBoxLeft: 0,
              actualBoundingBoxRight: 0,
            }
          }
          ctx.font = `${c.fontStyle} ${c.fontWeight} ${c.fontSize}px ${c.fontFamily}`
          const m = ctx.measureText(text)
          return {
            width: toFinite(m.width),
            actualBoundingBoxAscent: toFinite(m.actualBoundingBoxAscent),
            actualBoundingBoxDescent: toFinite(m.actualBoundingBoxDescent),
            actualBoundingBoxLeft: toFinite(m.actualBoundingBoxLeft),
            actualBoundingBoxRight: toFinite(m.actualBoundingBoxRight),
          }
        }

        function toFinite(value) {
          return Number.isFinite(value) ? value : 0
        }

        function anchorOffsetFromBBox(anchor, width) {
          if (anchor === 'middle') return width / 2
          if (anchor === 'end') return width
          return 0
        }

        function computeStats(rows) {
          const metricKeys = [
            'bboxW',
            'bboxH',
            'lengthSvg',
            'rangeW',
            'rangeH',
            'canvasW',
            'canvasAscent',
            'canvasDescent',
            'driftWidthSvgVsCanvas',
            'driftWidthSvgLengthVsCanvas',
            'driftHeightRangeVsBBox',
            'driftBaselineVsCanvas',
            'driftAnchorVsCanvas',
          ]
          const stats = {}
          for (const key of metricKeys) {
            const values = rows.map((r) => r[key]).filter(Number.isFinite)
            stats[key] = summarize(values)
          }
          return stats
        }

        function summarize(values) {
          if (!values.length) {
            return { count: 0, min: 0, max: 0, mean: 0, stddev: 0 }
          }
          let min = Infinity
          let max = -Infinity
          let sum = 0
          for (const v of values) {
            if (v < min) min = v
            if (v > max) max = v
            sum += v
          }
          const mean = sum / values.length
          let variance = 0
          for (const v of values) {
            const d = v - mean
            variance += d * d
          }
          variance /= values.length
          return { count: values.length, min, max, mean, stddev: Math.sqrt(variance) }
        }

        function computeDriftBuckets(rows) {
          const driftKeys = [
            'driftWidthSvgVsCanvas',
            'driftWidthSvgLengthVsCanvas',
            'driftHeightRangeVsBBox',
            'driftBaselineVsCanvas',
            'driftAnchorVsCanvas',
          ]
          const map = {}
          for (const key of driftKeys) {
            const counts = new Array(DRIFT_BUCKET_EDGES_ABS_PX.length + 1).fill(0)
            for (const row of rows) {
              const abs = Math.abs(row[key])
              let placed = false
              for (let i = 0; i < DRIFT_BUCKET_EDGES_ABS_PX.length; i += 1) {
                if (abs <= DRIFT_BUCKET_EDGES_ABS_PX[i]) {
                  counts[i] += 1
                  placed = true
                  break
                }
              }
              if (!placed) counts[counts.length - 1] += 1
            }
            map[key] = counts
          }
          return map
        }

        function detectOutliers(rows, stats, sigmaThreshold) {
          const keys = [
            'driftWidthSvgVsCanvas',
            'driftHeightRangeVsBBox',
            'driftBaselineVsCanvas',
            'driftAnchorVsCanvas',
          ]
          const ids = new Set()
          for (const row of rows) {
            for (const key of keys) {
              const meta = stats[key]
              if (!meta || meta.stddev === 0) continue
              const z = Math.abs((row[key] - meta.mean) / meta.stddev)
              if (z >= sigmaThreshold) {
                ids.add(row.idx)
                break
              }
            }
          }
          return ids
        }

        function sortRows(rows, key, dir) {
          const sign = dir === 'asc' ? 1 : -1
          return [...rows].sort((a, b) => {
            const av = valueForSort(a, key)
            const bv = valueForSort(b, key)
            if (av === bv) return a.idx - b.idx
            return av > bv ? sign : -sign
          })
        }

        function valueForSort(row, key) {
          const value = row[key]
          return typeof value === 'number' ? value : Number(value) || 0
        }

        function renderMeta(target, cfg, measured, outlierCount) {
          const rows = [
            ['count', String(cfg.count)],
            ['seed', String(cfg.seed)],
            ['svg size', `${cfg.width} x ${cfg.rowHeight * (cfg.count + 2)}`],
            ['sort', `${cfg.sortBy} (${cfg.sortDir})`],
            ['outlier sigma', String(cfg.outlierSigma)],
            ['outliers', String(outlierCount)],
            ['measured', String(measured.length)],
          ]
          target.innerHTML = rows
            .map(([k, v]) => `<div class="key">${escapeHtml(k)}</div><div class="mono">${escapeHtml(v)}</div>`)
            .join('')
        }

        function renderSummary(tbody, stats) {
          const keys = Object.keys(stats)
          tbody.innerHTML = keys
            .map((k) => {
              const s = stats[k]
              return `
                <tr>
                  <td class="mono">${escapeHtml(k)}</td>
                  <td class="mono">${fmt(s.min)}</td>
                  <td class="mono">${fmt(s.max)}</td>
                  <td class="mono">${fmt(s.mean)}</td>
                  <td class="mono">${fmt(s.stddev)}</td>
                </tr>
              `
            })
            .join('')
        }

        function renderBuckets(tbody, buckets) {
          const keys = Object.keys(buckets)
          tbody.innerHTML = keys
            .map((key) => {
              const c = buckets[key]
              return `
                <tr>
                  <td class="mono">${escapeHtml(key)}</td>
                  <td class="mono">${c[0]}</td>
                  <td class="mono">${c[1]}</td>
                  <td class="mono">${c[2]}</td>
                  <td class="mono">${c[3]}</td>
                  <td class="mono">${c[4]}</td>
                  <td class="mono">${c[5]}</td>
                  <td class="mono">${c[6]}</td>
                </tr>
              `
            })
            .join('')
        }

        function renderCases(tbody, rows, outlierIds) {
          tbody.innerHTML = rows
            .map((r) => {
              const outlier = outlierIds.has(r.idx) ? 'outlier' : ''
              return `
                <tr class="${outlier}">
                  <td class="mono">${r.idx}</td>
                  <td class="mono">${r.fontSize}</td>
                  <td class="mono">${r.fontWeight}</td>
                  <td class="mono">${escapeHtml(r.dominantBaseline)}</td>
                  <td class="mono">${fmt(r.driftBaselineVsCanvas)}</td>
                  <td class="mono">${fmt(r.driftWidthSvgVsCanvas)}</td>
                  <td class="mono">${fmt(r.driftHeightRangeVsBBox)}</td>
                </tr>
              `
            })
            .join('')
        }

        function wireSortHeaders(rows, outlierIds, cfg) {
          const headers = document.querySelectorAll('th[data-key]')
          headers.forEach((el) => {
            el.addEventListener('click', () => {
              const key = el.getAttribute('data-key') || 'idx'
              if (cfg.sortBy === key) {
                cfg.sortDir = cfg.sortDir === 'asc' ? 'desc' : 'asc'
              } else {
                cfg.sortBy = key
                cfg.sortDir = 'desc'
              }
              const sorted = sortRows(rows, cfg.sortBy, cfg.sortDir).slice(0, cfg.visibleRows)
              renderCases(rowsBody, sorted, outlierIds)
              renderMeta(metaEl, cfg, rows, outlierIds.size)
            })
          })
        }

        function fmt(value) {
          if (!Number.isFinite(value)) return '0'
          return Math.abs(value) >= 1000 ? value.toFixed(1) : value.toFixed(3)
        }

        function escapeHtml(value) {
          return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;')
        }
      })()
    </script>
  </body>
</html>
