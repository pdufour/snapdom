<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FO text-leaf normalize probe</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 14px 24px;
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      color: #111;
    }
    #capture-target {
      width: 500px;
      max-width: 100%;
      font: 600 16px/1.35 system-ui, -apple-system, sans-serif;
      background: #fff;
      border: 1px solid #e2e8f0;
    }
    .flex-row-stretch {
      display: flex;
      align-items: stretch;
      min-height: 48px;
    }
    .flex-row-stretch .link-center {
      display: flex;
      align-items: center;
      padding: 0 12px;
      text-decoration: none;
      color: #111;
    }
    #status { margin-top: 12px; font: 12px/1.45 ui-monospace, Menlo, monospace; color: #334155; }
  </style>
</head>
<body>
  <h1>experimentalFoTextLeafNormalize — flex row stretch</h1>
  <div id="capture-target">
    <div class="flex-row-stretch" aria-label="Flex row stretch fixture">
      <a class="link-center" href="#" id="landmark">Home</a>
      <a class="link-center" href="#">Products</a>
    </div>
  </div>
  <p id="status">Booting…</p>
  <script type="module">
    import { snapdom } from '/dist/snapdom.mjs'
    import {
      compareThreeWayInk,
      findLandmarkElement,
      parseCaptureMeta,
      svgFromDataUrl,
    } from './fo-fix-lab-runner.js'

    window.snapdom = snapdom

    const root = document.getElementById('capture-target')
    const status = document.getElementById('status')
    const params = new URLSearchParams(location.search)
    const dpr = Math.max(0.5, Number(params.get('dpr')) || 1)
    const scale = Math.max(0.25, Number(params.get('scale')) || 1)
    const landmark = (params.get('landmark') || 'Home').trim()

    const PIN_PROPS = ['line-height', 'vertical-align', 'display']

    /** @param {Element} el */
    function livePinSnapshot(el) {
      const cs = getComputedStyle(el)
      /** @type {Record<string, string>} */
      const out = {}
      for (const prop of PIN_PROPS) out[prop] = cs.getPropertyValue(prop)
      return out
    }

    /** @param {string} svgText @param {Record<string, string>} live */
    function serializedPinInSvg(svgText, live) {
      /** @type {Record<string, boolean>} */
      const found = {}
      for (const prop of PIN_PROPS) {
        const val = live[prop]
        if (!val) {
          found[prop] = false
          continue
        }
        const esc = val.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
        found[prop] = new RegExp(`${prop}\\s*:\\s*${esc}`, 'i').test(svgText)
      }
      return found
    }

    const VARIANTS = [
      { id: 'baseline', experimentalFoTextLeafNormalize: false },
      { id: 'textLeafNormalize', experimentalFoTextLeafNormalize: true },
    ]

    async function runVariant(variant) {
      const opts = {
        dpr,
        scale,
        experimentalFoTextLeafNormalize: variant.experimentalFoTextLeafNormalize,
      }
      const snap = await snapdom(root, opts)
      const rawUrl = await snap.toRaw()
      const svgText = svgFromDataUrl(rawUrl)
      const cssW = root.offsetWidth || root.getBoundingClientRect().width
      const cssH = root.offsetHeight || root.getBoundingClientRect().height
      const dims = { cssW: cssW * scale, cssH: cssH * scale, dpr }
      const meta = parseCaptureMeta(svgText, root)
      const canvas = await snap.toCanvas()
      const el = findLandmarkElement(root, landmark)
      if (!el) throw new Error(`landmark "${landmark}" not found`)
      const livePin = livePinSnapshot(el)
      const cmp = compareThreeWayInk(root, canvas, svgText, el, dpr, { cssW, cssH })
      return {
        id: variant.id,
        flags: {
          experimentalFoTextLeafNormalize: variant.experimentalFoTextLeafNormalize,
        },
        livePin,
        serializedPinInSvg: serializedPinInSvg(svgText, livePin),
        threeWay: {
          livePaintedTopInBorder: cmp.live?.topInBorder ?? null,
          svgPaintedTopInBorder: cmp.svg?.topInBorder ?? null,
          canvasPaintedTopInBorder: cmp.canvas?.topInBorder ?? null,
          liveVsSvgTopPx: cmp.liveVsSvgTopPx ?? null,
          liveVsCanvasTopPx: cmp.liveVsCanvasTopPx ?? null,
          svgVsCanvasTopPx:
            cmp.svg?.topInBorder != null && cmp.canvas?.topInBorder != null
              ? cmp.canvas.topInBorder - cmp.svg.topInBorder
              : null,
        },
        captureMeta: meta,
      }
    }

    async function runProbe() {
      await document.fonts.ready
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)))

      const rows = []
      for (const variant of VARIANTS) {
        rows.push(await runVariant(variant))
      }

      const baseline = rows.find((r) => r.id === 'baseline')
      const baselineCanvas = baseline?.threeWay?.liveVsCanvasTopPx ?? null

      return {
        fixture: 'flex-row-stretch-link-center',
        landmark,
        dpr,
        scale,
        flagScope: ['experimentalFoTextLeafNormalize'],
        pinProps: PIN_PROPS,
        variants: rows,
        baselineCanvasDeltaPx: baselineCanvas,
        comparisons: rows.map((row) => ({
          id: row.id,
          canvasDeltaPx: row.threeWay?.liveVsCanvasTopPx ?? null,
          svgDeltaPx: row.threeWay?.liveVsSvgTopPx ?? null,
          svgVsCanvasPx: row.threeWay?.svgVsCanvasTopPx ?? null,
          deltaFromBaselinePx:
            baselineCanvas != null && row.threeWay?.liveVsCanvasTopPx != null
              ? row.threeWay.liveVsCanvasTopPx - baselineCanvas
              : null,
          livePin: row.livePin,
          serializedPinInSvg: row.serializedPinInSvg,
        })),
      }
    }

    window.__foTextLeafFlagsProbe = {
      ready: false,
      bootError: null,
      run: runProbe,
    }

    runProbe()
      .then((payload) => {
        window.__foTextLeafFlagsProbe.last = payload
        const b = payload.baselineCanvasDeltaPx
        status.textContent =
          b != null
            ? `Ready — baseline canvasΔ=${b.toFixed(3)}px (${payload.variants.length} variants).`
            : 'Ready — probe complete.'
      })
      .catch((err) => {
        window.__foTextLeafFlagsProbe.bootError = String(err?.message || err)
        status.textContent = `Boot failed: ${window.__foTextLeafFlagsProbe.bootError}`
      })
      .finally(() => {
        window.__foTextLeafFlagsProbe.ready = true
      })
  </script>
</body>
</html>
