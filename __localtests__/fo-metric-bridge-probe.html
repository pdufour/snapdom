<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FO metric bridge probe</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; }
    body { margin: 12px; font-family: system-ui, sans-serif; }
    #capture-target {
      position: relative;
      width: 500px;
      font: 600 16px/1.35 system-ui, -apple-system, sans-serif;
      background: #fff;
      border: 1px solid #e2e8f0;
    }
    nav.mini-nav { display: flex; align-items: stretch; min-height: 48px; }
    nav.mini-nav a { display: flex; align-items: center; padding: 0 12px; color: #111; text-decoration: none; }
    .ruler {
      position: absolute;
      left: 0;
      right: 0;
      height: 0;
      border-top: 2px solid;
      pointer-events: none;
      z-index: 2;
    }
    .ruler-range { border-color: #22c55e; }
    .ruler-cap { border-color: #ef4444; }
    .ruler-canvas { border-color: #3b82f6; }
    #status { margin-top: 8px; font: 12px ui-monospace, monospace; color: #475569; }
  </style>
</head>
<body>
  <div id="capture-target">
    <nav class="mini-nav" aria-label="Mini nav">
      <a href="#">Home</a>
      <a href="#">Products</a>
    </nav>
    <div class="ruler ruler-range" id="ruler-range" title="Green: live Range ink top"></div>
    <div class="ruler ruler-cap" id="ruler-cap" title="Red: lab cap-model top"></div>
    <div class="ruler ruler-canvas" id="ruler-canvas" title="Blue: canvas integer ink row"></div>
  </div>
  <p id="status">Booting…</p>
  <script type="module">
    import { snapdom } from '/dist/snapdom.mjs'
    import { getFoFixRecipe } from './fo-fix-recipes.js'
    import {
      compareThreeWayInk,
      findLandmarkElement,
      measureLivePaintedInk,
      runFoFixProbe,
    } from './fo-fix-lab-runner.js'

    window.snapdom = snapdom

    const params = new URLSearchParams(location.search)
    const dpr = Math.max(0.5, Number(params.get('dpr')) || 1)
    const scale = Math.max(0.25, Number(params.get('scale')) || 1)
    const landmark = (params.get('landmark') || 'Home').trim()

    function roundPx(v) {
      return v == null || !Number.isFinite(v) ? null : Math.round(v * 1000) / 1000
    }

    function placeRuler(id, topCss) {
      const el = document.getElementById(id)
      if (el && topCss != null) el.style.top = `${topCss}px`
    }

    async function probeRecipe(root, el, recipeId, patchId = null) {
      const recipe = getFoFixRecipe(recipeId)
      const row = await runFoFixProbe(recipe, {
        dpr,
        scale,
        landmark,
        root,
        labToCanvasOpts: {
          disableGbcrFracNudge: true,
          rasterOnlySvgPatch: patchId ?? undefined,
        },
      })
      const cmp = compareThreeWayInk(root, row.canvas, row.svgText, el, dpr, {
        cssW: root.offsetWidth,
        cssH: root.offsetHeight,
      }, { includeFractionalInkScan: true })
      return { row, cmp }
    }

    function metricBundle(label, cmp) {
      const rangeTop = cmp.live?.topInBorder ?? null
      const capTop = cmp.liveCapModel?.topInBorder ?? null
      const canvasInt = cmp.canvas?.topInBorder ?? null
      return {
        label,
        liveReference: {
          rangeTopInBorder: roundPx(rangeTop),
          capLabTopInBorder: roundPx(capTop),
          rangeMinusCapLab: roundPx((rangeTop ?? 0) - (capTop ?? 0)),
        },
        canvas: {
          integerTopInBorder: roundPx(canvasInt),
          integerDeviceRow: cmp.canvas?.firstInkDeviceRow ?? null,
          fractionalTopInBorder: roundPx(cmp.canvas?.fractionalTopInBorder ?? null),
        },
        deltas: {
          labRangeLiveVsCanvasTopPx: roundPx(cmp.liveVsCanvasTopPx),
          labCapModelCanvasDeltaPx: roundPx(cmp.deltaTopCapModel),
          reconciliationRangeMinusCapDelta: roundPx(
            (cmp.liveVsCanvasTopPx ?? 0) - (cmp.deltaTopCapModel ?? 0),
          ),
        },
        fractionalVsRange: cmp.fractionalCanvasDelta
          ? {
              integer: roundPx(cmp.fractionalCanvasDelta.integer),
              fractionalThreshold: roundPx(cmp.fractionalCanvasDelta.fractionalThreshold),
              fractionalCom: roundPx(cmp.fractionalCanvasDelta.fractionalCom),
            }
          : null,
      }
    }

    async function run() {
      const status = document.getElementById('status')
      const root = document.getElementById('capture-target')
      await document.fonts.ready
      const el = findLandmarkElement(root, landmark)
      if (!el) throw new Error(`landmark ${landmark} not found`)

      const baseline = await probeRecipe(root, el, 'product-baseline')
      const w7 = await probeRecipe(root, el, 'tc-fix-w7-rfork-fo-y-half-leading-meta', 'fo-y-half-leading-meta')

      const rangeRootTop = measureLivePaintedInk(el, root)?.top ?? null
      placeRuler('ruler-range', rangeRootTop)
      placeRuler('ruler-cap', baseline.cmp.liveCapModel?.top ?? null)
      placeRuler('ruler-canvas', baseline.cmp.canvas?.top ?? null)

      status.textContent = 'Done.'
      return {
        probe: 'fo-metric-bridge',
        generatedAt: new Date().toISOString(),
        fixture: 'mini-nav',
        dpr,
        scale,
        landmark,
        rulers: {
          rangeRootTopPx: roundPx(rangeRootTop),
          capLabRootTopPx: roundPx(baseline.cmp.liveCapModel?.top),
          canvasIntegerRootTopPx: roundPx(baseline.cmp.canvas?.top),
          w7CanvasIntegerRootTopPx: roundPx(w7.cmp.canvas?.top),
        },
        baseline: metricBundle('product-baseline', baseline.cmp),
        w7: metricBundle('tc-fix-w7-rfork-fo-y-half-leading-meta', w7.cmp),
        w7Effect: {
          baselineRangeDelta: roundPx(baseline.cmp.liveVsCanvasTopPx),
          w7RangeDelta: roundPx(w7.cmp.liveVsCanvasTopPx),
          baselineCapDelta: roundPx(baseline.cmp.deltaTopCapModel),
          w7CapDelta: roundPx(w7.cmp.deltaTopCapModel),
          baselineCanvasRow: baseline.cmp.canvas?.firstInkDeviceRow ?? null,
          w7CanvasRow: w7.cmp.canvas?.firstInkDeviceRow ?? null,
          rangeSubpixelResidual: roundPx(
            (w7.cmp.live?.topInBorder ?? 0) - (w7.cmp.canvas?.topInBorder ?? 0),
          ),
        },
        formula: {
          labRange: 'canvas(integer device row / dpr) − live(Range union topInBorder)',
          labCap: 'canvas(integer) − live(cap lab model topInBorder)',
          blackbox: 'canvas(integer) − live(measureCapInk product) — see checkout structure report',
        },
        verdict: 'METRIC_FAMILIES_RECONCILED',
      }
    }

    window.__foMetricBridge = { ready: false, bootError: null, result: null }
    run()
      .then((result) => {
        window.__foMetricBridge.result = result
        window.__foMetricBridge.ready = true
      })
      .catch((err) => {
        window.__foMetricBridge.bootError = String(err?.message || err)
        window.__foMetricBridge.ready = true
        document.getElementById('status').textContent = `Error: ${window.__foMetricBridge.bootError}`
      })
  </script>
</body>
</html>
