<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>fo-canvas-ink e2e</title>
  <link rel="icon" href="data:," />
  <script type="importmap">
  { "imports": { "image-trim": "https://esm.sh/image-trim@1.0.0" } }
  </script>
</head>
<body>
  <script type="module">
    import {
      INK_SCAN_CAP_CORE_DEFAULTS,
      ensureInkScanBackend,
      inkTopRowFromCanvasRegion,
      registerImageTrimGetBorders,
    } from './fo-ink-bounds-scan.mjs'

    const params = new URLSearchParams(location.search)
    const inkTop = Number(params.get('inkTop') ?? 40)
    const canvasShift = Number(params.get('canvasShift') ?? 0)
    const BAND_W = 100
    const BAND_H = 80
    const BAR_H = 12
    const BAR_X = 15
    const BAR_W = 50
    const SCAN_OPTS = {
      mode: 'integer',
      solidBand: true,
      capCrest: true,
      refineUpward: true,
      ...INK_SCAN_CAP_CORE_DEFAULTS,
    }

    function buildBandSvg(top) {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${BAND_W}" height="${BAND_H}">
  <rect width="100%" height="100%" fill="#fff"/>
  <foreignObject width="${BAND_W}" height="${BAND_H}">
    <div xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;width:${BAND_W}px;height:${BAND_H}px;background:#fff;position:relative">
      <div style="position:absolute;top:${top}px;left:${BAR_X}px;width:${BAR_W}px;height:${BAR_H}px;background:#000"></div>
    </div>
  </foreignObject>
</svg>`
    }

    function svgDataUrl(svgText) {
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgText)}`
    }

    async function rasterizeCanvas(svgText, canvas, drawShiftY) {
      const img = new Image()
      img.src = svgDataUrl(svgText)
      await img.decode()
      const ctx = canvas.getContext('2d', { willReadFrequently: true })
      ctx.fillStyle = '#fff'
      ctx.fillRect(0, 0, BAND_W, BAND_H)
      ctx.drawImage(img, 0, drawShiftY, BAND_W, BAND_H)
    }

    function scanCanvas(canvas) {
      const hit = inkTopRowFromCanvasRegion(
        canvas.getContext('2d', { willReadFrequently: true }),
        0, 0, BAND_W, BAND_H,
        SCAN_OPTS,
      )
      return hit?.regionRow ?? hit?.row ?? null
    }

    window.__foCanvasInkE2e = {
      ready: false,
      bootError: null,
      inkTop,
      canvasShift,
      async scan() {
        const trimMod = await import('image-trim')
        registerImageTrimGetBorders(trimMod.getBorders)
        await ensureInkScanBackend('auto')
        const canvas = document.createElement('canvas')
        canvas.width = BAND_W
        canvas.height = BAND_H
        await rasterizeCanvas(buildBandSvg(inkTop), canvas, canvasShift)
        return scanCanvas(canvas)
      },
    }

    try {
      await document.fonts.ready
      window.__foCanvasInkE2e.ready = true
    } catch (e) {
      window.__foCanvasInkE2e.bootError = String(e?.message || e)
      window.__foCanvasInkE2e.ready = true
    }
  </script>
</body>
</html>
