<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>fo-stage-order e2e</title>
  <link rel="icon" href="data:," />
  <script type="importmap">
  {
    "imports": {
      "image-trim": "https://esm.sh/image-trim@1.0.0"
    }
  }
  </script>
  <style>
    .band-host { position: absolute; left: -9999px; top: 0; }
    .band { position: relative; width: 100px; height: 80px; background: #fff; overflow: hidden; }
    .ink-bar { position: absolute; left: 15px; width: 50px; height: 12px; background: #000; }
  </style>
</head>
<body>
  <div id="band-host" class="band-host"></div>
  <script type="module">
    import {
      INK_SCAN_CAP_CORE_DEFAULTS,
      ensureInkScanBackend,
      inkTopRowFromCanvasRegion,
      registerImageTrimGetBorders,
    } from './fo-ink-bounds-scan.mjs'

    /**
     * Sign: smaller Y = higher on screen.
     * Measured stack vs visual: canvas (highest) < live < svg (lowest) when canvasShift=-3, svgShift=-2.
     *
     * Visual stack (top→bottom): canvas ink, live ink, svg ink
     * Measured Y order: canvasTop < svgTop < liveTop
     */

    const BAND_W = 100
    const BAND_H = 80
    const BAR_H = 12
    const BAR_X = 15
    const BAR_W = 50
    const TOL = 1
    const SCAN_OPTS = {
      mode: 'integer',
      solidBand: true,
      capCrest: true,
      refineUpward: true,
      ...INK_SCAN_CAP_CORE_DEFAULTS,
    }

    const CASES = [
      {
        id: 'svg-higher-2',
        inkTop: 50,
        liveShift: 0,
        svgShift: -2,
        canvasShift: 0,
        expect: { svgHigherPx: 2 },
      },
      {
        id: 'product-baseline-order',
        inkTop: 50,
        liveShift: 0,
        svgShift: -2,
        canvasShift: -3,
        expect: { canvasLowerThanLive: true, svgHigherThanLive: true, canvasHigherThanSvg: true },
      },
    ]

    function buildBandSvg(top) {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${BAND_W}" height="${BAND_H}">
  <rect width="100%" height="100%" fill="#fff"/>
  <foreignObject width="${BAND_W}" height="${BAND_H}">
    <div xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:0;width:${BAND_W}px;height:${BAND_H}px;background:#fff;position:relative">
      <div style="position:absolute;top:${top}px;left:${BAR_X}px;width:${BAR_W}px;height:${BAR_H}px;background:#000"></div>
    </div>
  </foreignObject>
</svg>`
    }

    function svgDataUrl(svgText) {
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgText)}`
    }

    function mountLive(top) {
      const host = document.getElementById('band-host')
      host.replaceChildren()
      const band = document.createElement('div')
      band.className = 'band'
      const bar = document.createElement('div')
      bar.className = 'ink-bar'
      bar.style.top = `${top}px`
      band.appendChild(bar)
      host.appendChild(band)
      return band
    }

    function rasterizeLive(band, canvas) {
      const ctx = canvas.getContext('2d', { willReadFrequently: true })
      ctx.fillStyle = '#fff'
      ctx.fillRect(0, 0, BAND_W, BAND_H)
      const bandRect = band.getBoundingClientRect()
      const bar = band.querySelector('.ink-bar')
      const barRect = bar.getBoundingClientRect()
      ctx.fillStyle = '#000'
      ctx.fillRect(
        barRect.left - bandRect.left,
        barRect.top - bandRect.top,
        barRect.width,
        barRect.height,
      )
    }

    async function rasterizeSvg(svgText, canvas) {
      const img = new Image()
      await new Promise((res, rej) => {
        img.onload = () => res()
        img.onerror = () => rej(new Error('svg load'))
        img.src = svgDataUrl(svgText)
      })
      const ctx = canvas.getContext('2d', { willReadFrequently: true })
      ctx.fillStyle = '#fff'
      ctx.fillRect(0, 0, BAND_W, BAND_H)
      ctx.drawImage(img, 0, 0, BAND_W, BAND_H)
    }

    async function rasterizeCanvas(svgText, canvas, drawShiftY) {
      const img = new Image()
      img.src = svgDataUrl(svgText)
      await img.decode()
      const ctx = canvas.getContext('2d', { willReadFrequently: true })
      ctx.fillStyle = '#fff'
      ctx.fillRect(0, 0, BAND_W, BAND_H)
      ctx.drawImage(img, 0, drawShiftY, BAND_W, BAND_H)
    }

    function scanCanvas(canvas) {
      const hit = inkTopRowFromCanvasRegion(
        canvas.getContext('2d', { willReadFrequently: true }),
        0, 0, BAND_W, BAND_H,
        SCAN_OPTS,
      )
      return hit?.regionRow ?? hit?.row ?? null
    }

    function makeCanvas() {
      const c = document.createElement('canvas')
      c.width = BAND_W
      c.height = BAND_H
      return c
    }

    async function runCase(def) {
      const liveInkTop = def.inkTop + (def.liveShift ?? 0)
      const svgInkTop = def.inkTop + (def.svgShift ?? 0)
      const canvasShift = def.canvasShift ?? 0

      const liveCanvas = makeCanvas()
      const svgCanvas = makeCanvas()
      const canvasStage = makeCanvas()

      rasterizeLive(mountLive(liveInkTop), liveCanvas)
      await rasterizeSvg(buildBandSvg(svgInkTop), svgCanvas)
      await rasterizeCanvas(buildBandSvg(def.inkTop), canvasStage, canvasShift)

      const liveTop = scanCanvas(liveCanvas)
      const svgTop = scanCanvas(svgCanvas)
      const canvasTop = scanCanvas(canvasStage)
      const svgHigherPx = liveTop != null && svgTop != null ? liveTop - svgTop : null

      const errors = []
      const exp = def.expect ?? {}
      if (liveTop == null || svgTop == null || canvasTop == null) {
        errors.push('missing scan row')
      } else if (Number.isFinite(exp.svgHigherPx)) {
        if (Math.abs(svgHigherPx - exp.svgHigherPx) > TOL) {
          errors.push(`svgHigherPx ${svgHigherPx} expected ${exp.svgHigherPx}`)
        }
      }
      if (exp.canvasLowerThanLive && !(canvasTop < liveTop)) {
        errors.push(`canvas Y ${canvasTop} should be < live Y ${liveTop}`)
      }
      if (exp.svgHigherThanLive && !(svgTop < liveTop)) {
        errors.push(`svg Y ${svgTop} should be < live Y ${liveTop}`)
      }
      if (exp.canvasHigherThanSvg && !(canvasTop < svgTop)) {
        errors.push(`canvas Y ${canvasTop} should be < svg Y ${svgTop}`)
      }

      return {
        id: def.id,
        liveTop,
        svgTop,
        canvasTop,
        svgHigherPx,
        visualStack: 'canvas (highest) · live · svg (lowest)',
        measuredOrder:
          canvasTop < svgTop && svgTop < liveTop
            ? 'canvas Y < svg Y < live Y'
            : 'unexpected',
        pass: errors.length === 0,
        errors,
      }
    }

    window.__foStageOrderE2e = {
      ready: false,
      bootError: null,
      tol: TOL,
      cases: CASES.map((c) => c.id),
      async run() {
        const trimMod = await import('image-trim')
        registerImageTrimGetBorders(trimMod.getBorders)
        await ensureInkScanBackend('auto')
        const matrix = []
        for (const def of CASES) {
          matrix.push(await runCase(def))
        }
        return {
          tol: TOL,
          matrix,
          pass: matrix.every((r) => r.pass),
        }
      },
    }

    try {
      await document.fonts.ready
      window.__foStageOrderE2e.ready = true
    } catch (e) {
      window.__foStageOrderE2e.bootError = String(e?.message || e)
      window.__foStageOrderE2e.ready = true
    }
  </script>
</body>
</html>
