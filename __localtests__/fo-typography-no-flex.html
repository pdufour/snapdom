<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typography no-flex — three-way ink</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 14px 24px;
      font-family: system-ui, sans-serif;
      background: #f8fafc;
      color: #111;
    }
    #capture-target {
      width: 500px;
      max-width: 100%;
      font: 600 16px/1.35 system-ui, -apple-system, sans-serif;
      background: #fff;
      border: 1px solid #e2e8f0;
    }
    /* Single-line text leaf — no display:flex ancestor */
    #text-leaf {
      display: inline-block;
      padding: 12px;
      color: #111;
    }
    #status { margin-top: 12px; font: 12px/1.45 ui-monospace, Menlo, monospace; color: #334155; }
  </style>
</head>
<body>
  <h1>Typography-only (no flex parent)</h1>
  <div id="capture-target">
    <span id="text-leaf">Home</span>
  </div>
  <p id="status">Booting…</p>
  <script type="module">
    import { snapdom } from '/dist/snapdom.mjs'
    import {
      compareThreeWayInk,
      findLandmarkElement,
      getFoFixRecipe,
      runFoFixProbe,
    } from './fo-fix-lab-runner.js'

    window.snapdom = snapdom

    const root = document.getElementById('capture-target')
    const status = document.getElementById('status')
    const params = new URLSearchParams(location.search)
    const dpr = Math.max(0.5, Number(params.get('dpr')) || 2)
    const scale = Math.max(0.25, Number(params.get('scale')) || 1)
    const landmark = (params.get('landmark') || 'Home').trim()

    async function runProbe() {
      await document.fonts.ready
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)))

      const recipe = getFoFixRecipe('product-baseline')
      const probe = await runFoFixProbe(recipe, { root, landmark, dpr, scale })
      const el = findLandmarkElement(root, landmark)
      if (!el) throw new Error(`Landmark text leaf "${landmark}" not found`)

      const cmp = compareThreeWayInk(root, probe.canvas, probe.svgText, el, dpr)

      return {
        fixture: 'typography-no-flex',
        layout: 'single #text-leaf inline-block span; no display:flex ancestor',
        landmark,
        dpr,
        scale,
        recipe: { id: 'product-baseline' },
        threeWay: {
          livePaintedTopInBorder: cmp.live?.topInBorder ?? null,
          svgTopInBorder: cmp.svg?.topInBorder ?? null,
          canvasTopInBorder: cmp.canvas?.topInBorder ?? null,
          liveVsSvgTopPx: cmp.liveVsSvgTopPx ?? null,
          liveVsCanvasTopPx: cmp.liveVsCanvasTopPx ?? null,
          svgVsCanvasTopPx:
            cmp.svg?.topInBorder != null && cmp.canvas?.topInBorder != null
              ? cmp.canvas.topInBorder - cmp.svg.topInBorder
              : null,
        },
        canvasBacking: probe.canvas
          ? { width: probe.canvas.width, height: probe.canvas.height }
          : null,
      }
    }

    window.__foTypographyNoFlex = {
      ready: false,
      bootError: null,
      run: runProbe,
    }

    runProbe()
      .then((payload) => {
        window.__foTypographyNoFlex.last = payload
        const d = payload.threeWay?.liveVsCanvasTopPx
        status.textContent =
          d != null
            ? `Ready — canvasΔ=${d.toFixed(3)}px (no-flex single-line text).`
            : 'Ready — probe complete.'
      })
      .catch((err) => {
        window.__foTypographyNoFlex.bootError = String(err?.message || err)
        status.textContent = `Boot failed: ${window.__foTypographyNoFlex.bootError}`
      })
      .finally(() => {
        window.__foTypographyNoFlex.ready = true
      })
  </script>
</body>
</html>
