<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>fo-canvas-vs-svg ink e2e</title>
  <link rel="icon" href="data:," />
  <script type="importmap">
  { "imports": { "image-trim": "https://esm.sh/image-trim@1.0.0" } }
  </script>
</head>
<body>
  <script type="module">
    import {
      INK_SCAN_CAP_CORE_DEFAULTS,
      ensureInkScanBackend,
      inkTopRowFromCanvasRegion,
      registerImageTrimGetBorders,
    } from './fo-ink-bounds-scan.mjs'

    const BAND_W = 100
    const BAND_H = 80
    const BAR_H = 12
    /** SVG ink lower on screen (larger row); canvas higher (smaller row). */
    const SVG_ROW = 48
    const CANVAS_ROW = 45
    const MIN_GAP = 2
    const MAX_GAP = 3.5

    const SCAN_OPTS = {
      mode: 'integer',
      solidBand: true,
      capCrest: true,
      refineUpward: true,
      ...INK_SCAN_CAP_CORE_DEFAULTS,
    }

    function buildBandSvg(inkTop) {
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${BAND_W}" height="${BAND_H}" viewBox="0 0 ${BAND_W} ${BAND_H}">
  <rect width="100%" height="100%" fill="#fff"/>
  <rect x="15" y="${inkTop}" width="50" height="${BAR_H}" fill="#000"/>
</svg>`
    }

    function svgDataUrl(svgText) {
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgText)}`
    }

    function makeCanvas() {
      const c = document.createElement('canvas')
      c.width = BAND_W
      c.height = BAND_H
      return c
    }

    async function rasterizeSvgPreview(svgText, canvas) {
      const img = new Image()
      img.decoding = 'sync'
      await new Promise((resolve, reject) => {
        img.onload = () => resolve()
        img.onerror = () => reject(new Error('svg preview load failed'))
        img.src = svgDataUrl(svgText)
      })
      const ctx = canvas.getContext('2d', { willReadFrequently: true })
      ctx.fillStyle = '#fff'
      ctx.fillRect(0, 0, BAND_W, BAND_H)
      ctx.drawImage(img, 0, 0, BAND_W, BAND_H)
    }

    async function rasterizeCanvasDecode(svgText, canvas) {
      const url = svgDataUrl(svgText)
      const img = new Image()
      if (typeof img.decode === 'function') {
        img.src = url
        await img.decode()
      } else {
        await new Promise((resolve, reject) => {
          img.onload = () => resolve()
          img.onerror = () => reject(new Error('canvas decode load failed'))
          img.src = url
        })
      }
      const ctx = canvas.getContext('2d', { willReadFrequently: true })
      ctx.fillStyle = '#fff'
      ctx.fillRect(0, 0, BAND_W, BAND_H)
      ctx.drawImage(img, 0, 0, BAND_W, BAND_H)
    }

    function scanTop(canvas) {
      const hit = inkTopRowFromCanvasRegion(
        canvas.getContext('2d', { willReadFrequently: true }),
        0,
        0,
        BAND_W,
        BAND_H,
        SCAN_OPTS,
      )
      return hit?.regionRow ?? hit?.row ?? null
    }

    window.__foCanvasVsSvgE2e = {
      ready: false,
      bootError: null,
      async run() {
        const trimMod = await import('image-trim')
        registerImageTrimGetBorders(trimMod.getBorders)
        await ensureInkScanBackend('auto')

        const svgCanvas = makeCanvas()
        const canvasStage = makeCanvas()
        await rasterizeSvgPreview(buildBandSvg(SVG_ROW), svgCanvas)
        await rasterizeCanvasDecode(buildBandSvg(CANVAS_ROW), canvasStage)

        const svgTop = scanTop(svgCanvas)
        const canvasTop = scanTop(canvasStage)
        const canvasHigherPx =
          svgTop != null && canvasTop != null ? svgTop - canvasTop : null
        const pass =
          canvasTop != null &&
          svgTop != null &&
          canvasTop < svgTop &&
          canvasHigherPx >= MIN_GAP &&
          canvasHigherPx <= MAX_GAP

        return {
          svgRow: SVG_ROW,
          canvasRow: CANVAS_ROW,
          svgTop,
          canvasTop,
          canvasHigherPx,
          minGap: MIN_GAP,
          maxGap: MAX_GAP,
          pass,
        }
      },
    }

    try {
      await document.fonts.ready
      window.__foCanvasVsSvgE2e.ready = true
    } catch (e) {
      window.__foCanvasVsSvgE2e.bootError = String(e?.message || e)
      window.__foCanvasVsSvgE2e.ready = true
    }
  </script>
</body>
</html>
